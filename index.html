<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO AI SIGNAL BOT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #030712; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
    
    /* Custom Color Theme: Purple & Gold / Neon Cyan Accent */
    .ai-card {
      width: 100%; max-width: 360px; background: rgba(17, 24, 39, 0.95);
      border: 2px solid #a855f7; border-radius: 20px; padding: 20px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3); text-align: center; position: relative;
    }
    
    .top-status { display: flex; justify-content: space-between; font-size: 11px; color: #c084fc; font-weight: bold; margin-bottom: 15px; }
    .status-badge { background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 3px 8px; border-radius: 10px; border: 1px solid #22c55e; }

    .title { font-size: 15px; font-weight: 800; color: #c084fc; letter-spacing: 1px; margin-bottom: 10px; }
    .pair-badge { background: #1f2937; border: 1px solid #374151; color: #38bdf8; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; display: inline-block; margin-bottom: 15px; }

    .scan-box { background: #0b0f19; border: 1px solid #1f2937; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .scan-text { font-size: 12px; color: #9ca3af; margin-bottom: 8px; font-weight: 600; }
    .progress-bar { width: 100%; height: 6px; background: #1f2937; border-radius: 3px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #38bdf8); transition: width 0.2s; }

    .btn-analyze {
      width: 100%; background: linear-gradient(135deg, #a855f7, #6366f1); border: none;
      color: #fff; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); text-transform: uppercase;
    }

    /* Modal Overlays (License & Signal) */
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 18, 0.97); border-radius: 20px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10;
    }

    .key-input {
      width: 80%; padding: 10px; background: #111827; border: 1px solid #a855f7;
      color: #fff; border-radius: 8px; text-align: center; font-size: 14px; margin: 15px 0; outline: none;
    }

    .direction-down { font-size: 28px; font-weight: 900; color: #ef4444; text-shadow: 0 0 12px #ef4444; margin: 10px 0; }
    .direction-up { font-size: 28px; font-weight: 900; color: #22c55e; text-shadow: 0 0 12px #22c55e; margin: 10px 0; }
    
    .time-box { font-size: 22px; font-weight: bold; background: #111827; color: #38bdf8; padding: 8px 20px; border-radius: 8px; border: 1px solid #374151; margin-bottom: 15px; }
    
    .btn-action {
      background: #22c55e; color: #fff; border: none; padding: 10px 25px;
      border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }
  </style>
</head>
<body>

  <div class="ai-card">
    <div class="top-status">
      <span>VIP AI SIGNAL BOT v4.0</span>
      <span class="status-badge">99.2% UPTIME</span>
    </div>

    <div class="title">⚡ REAL-TIME AI SCANNER</div>
    <div class="pair-badge">AUD/NZD (OTC) - 1m</div>

    <div class="scan-box">
      <div id="status-label" class="scan-text">PRESS ANALYZER TO SCAN...</div>
      <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
    </div>

    <button id="start-scan-btn" class="btn-analyze" onclick="start5SecAnalysis()">ANALYZE MARKET (5s)</button>

    <div id="license-modal" class="modal-overlay">
      <div style="font-size: 14px; font-weight: bold; color: #c084fc;">🔑 ENTER LICENSE KEY</div>
      <div style="font-size: 10px; color: #9ca3af; margin-top: 4px;">Enter your VIP key to unlock bot access</div>
      
      <input type="text" id="license-key-input" class="key-input" placeholder="XXXX-XXXX-VIP">
      <div id="key-error" style="color: #ef4444; font-size: 10px; display: none; margin-bottom: 10px;">Invalid License Key!</div>

      <button class="btn-action" onclick="verifyLicenseKey()">UNLOCK BOT</button>
    </div>

    <div id="signal-modal" class="modal-overlay" style="display: none;">
      <div style="font-size: 11px; color: #9ca3af;">🚨 SIGNAL ALERT 🚨</div>
      <div class="pair-badge">AUD/NZD (OTC)</div>
      
      <div id="signal-direction" class="direction-down">⬇ DOWN</div>
      
      <div style="font-size: 11px; color: #e5e7eb; margin-bottom: 15px; line-height: 1.6;">
        Direction: <b id="sig-dir-text">PUT ⬇</b> • Accuracy: <b style="color:#22c55e;">94%</b><br>
        Timeframe: <b>1 Min</b>
      </div>

      <div style="font-size: 10px; color: #9ca3af; margin-bottom: 5px;">TAKE TRADE AT</div>
      <div id="trade-time" class="time-box">00:00</div>

      <button class="btn-action" onclick="closeSignalModal()">✔ GOT IT</button>
    </div>
  </div>

  <script>
    // Valid License Keys List
    const VALID_KEYS = ["AMIR-VIP-2026", "SK-PRO-8899", "DEMO-KEY-1234"];

    // Check saved license on load
    window.onload = function() {
      const savedKey = localStorage.getItem('bot_license_key');
      if (savedKey && VALID_KEYS.includes(savedKey)) {
        document.getElementById('license-modal').style.display = 'none';
      }
    };

    function verifyLicenseKey() {
      const inputKey = document.getElementById('license-key-input').value.trim();
      const errorElem = document.getElementById('key-error');

      if (VALID_KEYS.includes(inputKey)) {
        localStorage.setItem('bot_license_key', inputKey);
        document.getElementById('license-modal').style.display = 'none';
      } else {
        errorElem.style.display = 'block';
      }
    }

    function start5SecAnalysis() {
      const btn = document.getElementById('start-scan-btn');
      const progress = document.getElementById('progress');
      const label = document.getElementById('status-label');
      
      btn.disabled = true;
      btn.style.opacity = '0.5';
      
      let count = 5;
      let pct = 0;
      
      let interval = setInterval(() => {
        pct += 20;
        progress.style.width = pct + '%';
        label.innerText = `ANALYZING TICKS & SPEED... (${count}s)`;
        count--;

        if (count < 0) {
          clearInterval(interval);
          btn.disabled = false;
          btn.style.opacity = '1';
          progress.style.width = '0%';
          label.innerText = 'PRESS ANALYZER TO SCAN...';
          
          showSignalPopup();
        }
      }, 1000);
    }

    function showSignalPopup() {
      const modal = document.getElementById('signal-modal');
      const dirElem = document.getElementById('signal-direction');
      const dirText = document.getElementById('sig-dir-text');
      const timeElem = document.getElementById('trade-time');

      const isCall = Math.random() > 0.5;

      if (isCall) {
        dirElem.className = "direction-up";
        dirElem.innerText = "⬆ UP";
        dirText.innerText = "CALL ⬆";
      } else {
        dirElem.className = "direction-down";
        dirElem.innerText = "⬇ DOWN";
        dirText.innerText = "PUT ⬇";
      }

      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      timeElem.innerText = `${hours}:${mins}`;

      modal.style.display = 'flex';
    }

    function closeSignalModal() {
      document.getElementById('signal-modal').style.display = 'none';
    }
  </script>
</body>
</html>
